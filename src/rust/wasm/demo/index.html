<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>サクラ (Rust/WASM) デモ</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fdfcfa;
    --fg: #22201d;
    --muted: #6b6660;
    --line: #ddd8d0;
    --accent: #b4472f;
    --panel: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1a18;
      --fg: #ece9e4;
      --muted: #9a948c;
      --line: #383530;
      --accent: #e08a70;
      --panel: #232120;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 1.5rem;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.6 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  main { max-width: 60rem; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin: 0 0 .25rem; }
  .sub { color: var(--muted); margin: 0 0 1.25rem; font-size: .9rem; }
  textarea {
    width: 100%;
    min-height: 12rem;
    padding: .75rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    color: var(--fg);
    font: 14px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    resize: vertical;
  }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin: .75rem 0; }
  button {
    padding: .45rem .9rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    color: var(--fg);
    font: inherit;
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .samples { margin-left: auto; display: flex; gap: .35rem; flex-wrap: wrap; }
  .samples button { font-size: .82rem; padding: .3rem .6rem; }
  pre#log {
    margin: 0;
    padding: .75rem;
    min-height: 4rem;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace;
    white-space: pre-wrap;
    overflow-x: auto;
  }
  .ok { color: #2f7d4f; }
  .err { color: var(--accent); }
  .warn { color: #9a6b1f; }
  footer { margin-top: 1.5rem; color: var(--muted); font-size: .82rem; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>テキスト音楽「サクラ」— Rust / WebAssembly 版</h1>
  <p class="sub">MMLを書いてコンパイルすると、MIDIファイルが生成されます。</p>

  <textarea id="mml" spellcheck="false">テンポ120
音量100 音階5
ドレミファソラシド</textarea>

  <div class="row">
    <button id="compile" class="primary">コンパイル</button>
    <button id="download" disabled>MIDIをダウンロード</button>
    <span class="samples">
      <button data-mml="テンポ120&#10;音量100 音階5&#10;ドレミファソラシド">ストトン</button>
      <button data-mml="Tempo=140&#10;TR=1 @1 o5 l8 [4 cege]&#10;TR=2 @33 o3 l4 c g">2トラック</button>
      <button data-mml="Int i;&#10;For(i=0;i&lt;4;i=i+1){ o(4+i) cdef }">変数とループ</button>
      <button data-mml="曲名{&quot;テスト曲&quot;}&#10;作者{&quot;クジラ飛行机&quot;}&#10;ドレミ">メタ情報</button>
    </span>
  </div>

  <pre id="log">読み込み中…</pre>

  <footer>
    コアはI/Oを持たないRustライブラリで、このページ・CLI・WASIで同じコードが動きます。
    入力はUTF-8/CP932を自動判定し、MIDIのメタテキストは互換性のためCP932で書き出します。
  </footer>
</main>

<script type="module">
import init, { compileMml, version } from "../pkg/sakuramml_wasm.js";

const log = document.getElementById("log");
const editor = document.getElementById("mml");
const compileButton = document.getElementById("compile");
const downloadButton = document.getElementById("download");

let midi = null;

function show(html, kind = "") {
  log.className = kind;
  log.innerHTML = html;
}

function escapeHtml(text) {
  return text.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

try {
  await init();
  show(`準備完了 (sakuramml ${version()})`);
} catch (error) {
  show(`WASMの読み込みに失敗しました: ${escapeHtml(String(error))}`, "err");
}

compileButton.addEventListener("click", () => {
  let result;
  try {
    result = compileMml(editor.value);
  } catch (error) {
    midi = null;
    downloadButton.disabled = true;
    show(escapeHtml(String(error.message ?? error)), "err");
    return;
  }

  midi = result.midi;
  downloadButton.disabled = false;

  const lines = result.errors.length === 0
    ? [`<span class="ok">コンパイル成功: ${midi.length} バイト</span>`]
    : [`<span class="err">${result.errors.length}件のエラーがあります。不完全なMIDI: ${midi.length} バイト</span>`];
  for (const message of result.messages) {
    lines.push(`[表示] ${escapeHtml(message)}`);
  }
  for (const warning of result.warnings) {
    lines.push(`<span class="warn">${escapeHtml(warning)}</span>`);
  }
  for (const error of result.errors) {
    lines.push(`<span class="err">${escapeHtml(error)}</span>`);
  }
  show(lines.join("\n"));
});

downloadButton.addEventListener("click", () => {
  if (!midi) return;
  const url = URL.createObjectURL(new Blob([midi], { type: "audio/midi" }));
  const link = document.createElement("a");
  link.href = url;
  link.download = "song.mid";
  link.click();
  URL.revokeObjectURL(url);
});

for (const button of document.querySelectorAll(".samples button")) {
  button.addEventListener("click", () => {
    editor.value = button.dataset.mml;
    compileButton.click();
  });
}
</script>
</body>
</html>
