[package]
name = "sakuramml-wasm"
description = "WebAssembly bindings for the SakuraMML compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sakuramml-core = { path = "../core" }
wasm-bindgen = "0.2"

# wasm-pack ships an older wasm-opt than the features rustc now emits by
# default, so the post-processing pass has to be told to accept them.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = ["-O0", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
